<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>네이버 지도 - 건대입구역 맛집 탐색</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Google Fonts & Icon -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 기본 테마 및 레이아웃 설정 */
    :root {
      --naver-green: #03C75A;
      --naver-green-dark: #02b34f;
      --naver-green-light: #e8f9f0;
      --bg-gray: #f4f6fa;
      --text-main: #1e1e23;
      --text-sub: #707077;
      --text-muted: #9898a0;
      --border-light: #ebebeb;
      --border-focus: #b5b5b5;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --modal-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
      --font-main: 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background-color: #1a1a24;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 모바일 디바이스 목업 프레임 */
    .phone-container {
      width: 100%;
      max-width: 430px;
      height: 900px;
      max-height: 95vh;
      background-color: #fff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 40px;
      border: 8px solid #2d2d3a;
    }

    @media (max-width: 480px) {
      body {
        background-color: #fff;
      }

      .phone-container {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    /* 노치/상단바 목업 */
    .phone-header-bar {
      height: 36px;
      background-color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 600;
      color: #000;
      z-index: 1000;
      border-bottom: 1px solid var(--border-light);
    }

    .phone-header-bar .status-icons i {
      margin-left: 5px;
    }

    /* 메인 앱 영역 */
    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-gray);
    }

    /* 네이버 검색바 영역 */
    .search-section {
      background-color: #fff;
      padding: 12px 16px 8px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      z-index: 110;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background-color: #fff;
      border: 2px solid var(--naver-green);
      border-radius: 8px;
      height: 46px;
      padding: 0 12px;
      gap: 10px;
    }

    .search-bar .back-btn {
      color: var(--naver-green);
      font-size: 18px;
      cursor: pointer;
    }

    .search-input {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      border: none;
      outline: none;
      background: transparent;
      pointer-events: none;
      /* 단순 목업용으로 비활성화 */
    }

    .search-icons {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--naver-green);
      font-size: 16px;
    }

    /* 필터 프리셋 칩 영역 */
    .filter-section {
      background-color: #fff;
      padding: 4px 16px 12px 16px;
      z-index: 110;
      border-bottom: 1px solid var(--border-light);
    }

    .preset-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
    }

    .preset-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #e0e0e6;
      background-color: #fff;
      font-size: 13px;
      font-weight: 500;
      color: #4e4e55;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chip.active {
      background-color: var(--naver-green-light);
      border-color: var(--naver-green);
      color: var(--naver-green);
      font-weight: 700;
    }

    .chip-add {
      background-color: #f5f5f7;
      border-color: #e5e5eb;
    }

    .chip-add i {
      font-size: 11px;
      transition: transform 0.2s;
    }

    .chip-add.active i {
      transform: rotate(45deg);
    }

    /* 확장 태그 풀 */
    .expanded-tags-container {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
      background-color: #f9fafc;
      border-bottom: 0 solid var(--border-light);
      z-index: 109;
    }

    .expanded-tags-container.open {
      max-height: 160px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      overflow-y: auto;
    }

    .tags-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-item {
      padding: 6px 12px;
      border-radius: 16px;
      background-color: #fff;
      border: 1px solid #e2e2eb;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-item.active {
      background-color: #eaeefc;
      border-color: #4a72e6;
      color: #4a72e6;
      font-weight: 600;
    }

    /* 지도 영역 */
    .map-container {
      flex: 1;
      position: relative;
      z-index: 10;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 말풍선 형태의 커스텀 DivIcon */
    .custom-marker {
      background: none;
      border: none;
    }

    .marker-bubble {
      position: relative;
      background-color: #fff;
      border: 2px solid var(--naver-green);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -100%);
      width: auto;
      min-width: 50px;
      max-width: 140px;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .marker-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: var(--naver-green) transparent;
      display: block;
      width: 0;
    }

    .marker-bubble::before {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
      z-index: 1;
    }

    /* 선택된 마커 스타일 */
    .custom-marker.selected-pin .marker-bubble {
      background-color: #e11d48;
      border-color: #be123c;
      color: #fff;
      z-index: 999;
      transform: translate(-50%, -100%) scale(1.1);
    }

    .custom-marker.selected-pin .marker-bubble::after {
      border-color: #be123c transparent;
    }

    .custom-marker.selected-pin .marker-bubble::before {
      border-color: #e11d48 transparent;
    }

    /* 하단 바텀시트 */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 380px;
      background-color: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: var(--modal-shadow);
      z-index: 105;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      /* 기본 상태: 헤더와 핸들만 보이도록 아래로 내림 (접힌 상태) */
      transform: translateY(calc(100% - 64px));
    }

    /* 펼쳐진 상태 */
    .bottom-sheet.expanded {
      transform: translateY(0);
    }

    /* 드래그 핸들 */
    .sheet-handle-bar {
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background-color: #e0e0e6;
      border-radius: 2px;
    }

    /* 바텀시트 헤더 */
    .sheet-header {
      padding: 0 20px 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      /* 헤더 영역도 클릭 가능하게 변경 */
    }

    .sheet-header-title {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .sheet-header-title span {
      color: var(--naver-green);
      font-weight: 700;
    }

    /* 바텀시트 장소 리스트 */
    .places-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 20px 16px;
    }

    /* 장소 카드 */
    .place-card {
      display: flex;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      gap: 16px;
      transition: background-color 0.3s, padding 0.3s;
      border-radius: 8px;
    }

    .place-card:last-child {
      border-bottom: none;
    }

    .place-card.highlighted {
      animation: highlightPulse 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes highlightPulse {
      0% {
        background-color: rgba(3, 199, 90, 0.15);
      }

      100% {
        background-color: transparent;
      }
    }

    .place-img-wrapper {
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      background-color: #eef1f6;
    }

    .place-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .place-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .place-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .place-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .place-category {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .place-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .tag-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #f0f0f4;
      color: #55555e;
      font-weight: 500;
    }

    /* 현재 켜져 있는 필터 조건과 일치하는 매칭 배지 하이라이트 스타일 */
    .tag-badge.matched {
      background-color: var(--naver-green) !important;
      color: #fff !important;
      font-weight: 700 !important;
    }

    /* 0건 결과 컨테이너 */
    .empty-result-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 240px;
      text-align: center;
      padding: 20px;
    }

    .empty-icon {
      font-size: 40px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .empty-message {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .reset-btn {
      padding: 10px 20px;
      border-radius: 20px;
      background-color: var(--naver-green);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(3, 199, 90, 0.2);
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background-color: var(--naver-green-dark);
    }

    /* 상세보기 모달 */
    .detail-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      z-index: 300;
      /* 상단바보다 위에 노출 */
      display: none;
      /* 기본 상태 완전 숨김 */
      flex-direction: column;
    }

    .detail-modal.open {
      display: flex;
      /* 열릴 때만 노출 */
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .detail-header {
      position: relative;
      height: 200px;
      background-color: #eef1f6;
    }

    .detail-header-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .close-modal-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      z-index: 10;
      transition: background-color 0.2s;
    }

    .close-modal-btn:hover {
      background-color: rgba(0, 0, 0, 0.7);
    }

    .detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
    }

    .detail-meta {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 20px;
    }

    .detail-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .detail-name {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-main);
    }

    .detail-category {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .detail-info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .detail-info-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      color: #3f3f46;
      line-height: 1.4;
    }

    .detail-info-item i {
      width: 16px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .detail-options-section {
      margin-bottom: 24px;
    }

    .detail-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .detail-options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .detail-option-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      background-color: var(--bg-gray);
      color: var(--text-sub);
    }

    .detail-option-pill.active {
      background-color: var(--naver-green-light);
      color: var(--naver-green);
      font-weight: 600;
    }

    .detail-option-pill i {
      font-size: 12px;
    }

    .detail-footer-btn-container {
      padding: 16px 20px;
      border-top: 1px solid var(--border-light);
      background-color: #fff;
      display: flex;
      gap: 12px;
    }

    .select-place-btn {
      flex: 1;
      height: 52px;
      border-radius: 8px;
      background-color: var(--naver-green);
      color: #fff;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(3, 199, 90, 0.25);
      transition: background-color 0.2s;
    }

    .select-place-btn:hover {
      background-color: var(--naver-green-dark);
    }

    .cancel-place-btn {
      width: 100px;
      height: 52px;
      border-radius: 8px;
      background-color: #f4f4f5;
      color: #4e4e55;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s;
    }

    .cancel-place-btn:hover {
      background-color: #e4e4e7;
    }

    /* 태스크 완료 모달 팝업 */
    .completion-modal {
      display: none;
      /* 기본 숨김 */
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      /* 최상위 노출 */
      justify-content: center;
      align-items: center;
    }

    .completion-content {
      background: #fff;
      padding: 32px 24px;
      border-radius: 16px;
      width: 85%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .completion-icon {
      font-size: 40px;
      color: var(--naver-green);
      margin-bottom: 16px;
    }

    .completion-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .completion-msg {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .completion-shop {
      font-size: 15px;
      font-weight: 700;
      color: var(--naver-green);
      background-color: var(--naver-green-light);
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .completion-btn {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      background-color: var(--naver-green);
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .completion-btn:hover {
      background-color: var(--naver-green-dark);
    }
  </style>
</head>

<body>

  <!-- 모바일 디바이스 프레임 -->
  <div class="phone-container">

    <!-- 상단바 목업 -->
    <div class="phone-header-bar">
      <div class="time-status">12:30</div>
      <div class="status-icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-three-quarters"></i>
      </div>
    </div>

    <!-- 메인 앱 바디 -->
    <div class="app-body">

      <!-- 상단 검색창 -->
      <section class="search-section">
        <div class="search-bar">
          <i class="fa-solid fa-arrow-left back-btn"></i>
          <input type="text" class="search-input" value="건대입구역 맛집">
          <div class="search-icons">
            <i class="fa-solid fa-xmark" style="color:#a8a8af; font-size:14px;"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>
      </section>

      <!-- 상황 프리셋 칩 -->
      <section class="filter-section">
        <div class="preset-chips">
          <button class="chip" id="preset-family" data-preset="family">👨‍👩‍👧 가족모임</button>
          <button class="chip" id="preset-friends" data-preset="friends">👥 친구모임</button>
          <button class="chip" id="preset-dinner" data-preset="dinner">💼 회식</button>
          <button class="chip chip-add" id="toggle-tags-btn"><i class="fa-solid fa-plus"></i> 조건 추가</button>
        </div>
      </section>

      <!-- 확장 태그 풀 -->
      <section class="expanded-tags-container" id="expanded-tags-panel">
        <div class="tags-grid" id="tags-grid-container">
          <!-- JS를 통해 가나다순으로 채워짐 -->
        </div>
      </section>

      <!-- 지도 영역 -->
      <div class="map-container">
        <div id="map"></div>

      }
    ];
    let map = null;            // Leaflet 지도 객체
    let markers = [];          // 지도 상에 표시되고 있는 마커 배열
    let currentPreset = null;  // 현재 선택된 프리셋 ('family', 'friends', 'dinner', null)

    // 개별 태그의 ON/OFF 토글 상태 (전체 10개 태그 대상)
    const activeFilters = {
      parking: false,

      high_chair: false,
      room: false,
      reservation: false,
      conversation: false,
      comfortable_seat: false,

    // 상세 모달에 현재 노출 중인 장소 임시 보관
    let currentPlaceInDetail = null;

    // ----------------------------------------------------
    // 3. UI 요소 참조
    // ----------------------------------------------------
    const presetButtons = {
      family: document.getElementById('preset-family'),
      friends: document.getElementById('preset-friends'),
      dinner: document.getElementById('preset-dinner')
    };
    const toggleTagsBtn = document.getElementById('toggle-tags-btn');

    const placesListContainer = document.getElementById('places-list-container');

    const detailModal = document.getElementById('detail-modal');
    const detailImg = document.getElementById('detail-img');
    const detailName = document.getElementById('detail-name');
    const detailCategory = document.getElementById('detail-category');
    const detailAddress = document.getElementById('detail-address');
    const detailPhone = document.getElementById('detail-phone');
    const detailOptionsGrid = document.getElementById('detail-options-grid');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const cancelPlaceBtn = document.getElementById('cancel-place-btn');
    const selectPlaceBtn = document.getElementById('select-place-btn');

    // 태스크 완료 모달 요소 참조
    const completionModal = document.getElementById('completion-modal');
    const completionShopName = document.getElementById('completion-shop-name');
    const completionConfirmBtn = document.getElementById('completion-confirm-btn');

    // ----------------------------------------------------
    // 4. 초기화 함수
    // ----------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      renderExtendedTags();
      updateDashboard(); // fetch 없이 바로 실행
      setupEventListeners();
    });

    // 4-1. 지도 초기화 (건대입구역 2번 출구 기준)
    function initMap() {
      // 건대입구역 2번 출구 좌표: [37.5404, 127.0692]
      map = L.map('map', {
        zoomControl: false, // UI 깔끔하게 하기 위해 기본 줌 컨트롤 제거
        attributionControl: false // 하단 OSM 표기 삭제하여 심플하게
      }).setView([37.5404, 127.0692], 16);

      // CartoDB Positron 타일 사용 (외부 상점/POI가 거의 노출되지 않는 순수 맵 타일)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);
    }

    // 4-2. 확장 태그 풀 렌더링 (가나다순 10개 조건 태그 전체 노출)
    function renderExtendedTags() {
      tagsGridContainer.innerHTML = '';
      sortedExtendedTagKeys.forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'tag-item';
        btn.id = `tag-item-${key}`;
        btn.textContent = tagMeta[key];
        btn.addEventListener('click', () => toggleIndividualTag(key));
        tagsGridContainer.appendChild(btn);
      });
    }

    // 4-4. 이벤트 리스너 바인딩
    function setupEventListeners() {
      // 프리셋 버튼 클릭 이벤트
      Object.keys(presetButtons).forEach(presetKey => {
        presetButtons[presetKey].addEventListener('click', () => {
          selectPreset(presetKey);
        });
      });

      // [+ 조건 추가] 토글 버튼
      toggleTagsBtn.addEventListener('click', () => {
        const isOpen = expandedTagsPanel.classList.toggle('open');
        toggleTagsBtn.classList.toggle('active', isOpen);
      });

      // 바텀시트 토글 이벤트 리스너 추가
      const bottomSheet = document.getElementById('bottom-sheet');
      const sheetHandle = document.getElementById('sheet-handle');
      const sheetHeader = document.querySelector('.sheet-header');

      function toggleBottomSheet() {
        bottomSheet.classList.toggle('expanded');
      }

      sheetHandle.addEventListener('click', toggleBottomSheet);
      sheetHeader.addEventListener('click', toggleBottomSheet);

      // 상세보기 모달 닫기
      closeModalBtn.addEventListener('click', closeDetailModal);
      cancelPlaceBtn.addEventListener('click', closeDetailModal);

      // 상세보기 모달 [이 장소로 선택]
      selectPlaceBtn.addEventListener('click', completeTaskWithSelection);

      // 태스크 완료 확인 버튼 클릭 시 모달 닫고 리셋/종료 유도
      completionConfirmBtn.addEventListener('click', () => {
        completionModal.style.display = 'none';
      });
    }

    // ----------------------------------------------------
    // 5. 핵심 비즈니스 로직 (프리셋 & 태그 제어)
    // ----------------------------------------------------

    // 5-1. 프리셋 선택 및 변경 처리
    function selectPreset(presetKey) {
      // 0개 매칭 분기에서 복구 중인 경우를 감지하기 위함
      let wasZeroResult = (getFilteredPlaces().length === 0);

      if (currentPreset === presetKey) {
        // 동일 프리셋 클릭 시 해제
        currentPreset = null;
        logData.selectedPreset = "없음";
        // 모든 필터 해제
        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
      } else {
        // 프리셋 선택 변경 시: 이전의 토글 상태는 초기화
        currentPreset = presetKey;
        logData.selectedPreset = translatePresetName(presetKey);

        // 필터 리셋 후 해당 프리셋 기본 조건만 ON
        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
        const presetTags = presetConfig[presetKey];
        presetTags.forEach(tag => {
          activeFilters[tag] = true;
        });

        // 프리셋을 켜면 활성화된 조건들이 있는 태그 패널을 자동으로 확장하여 시각적 확인이 가능하게 함
        expandedTagsPanel.classList.add('open');
        toggleTagsBtn.classList.add('active');
      }

      // 복구 액션 감지 로직
      if (wasZeroResult) {
        // 0개 상태에서 프리셋을 변경/해제하여 다시 결과가 1개 이상이 된다면
        const nowCount = getFilteredPlaces().length;
        if (nowCount > 0) {
          logData.zeroResultRecoveryAction = "reset_clicked";
        }
      }

      updateDashboard();
    }

    // 프리셋 한글명 번역
    function translatePresetName(key) {
      if (key === 'family') return "가족모임";
      if (key === 'friends') return "친구모임";
      if (key === 'dinner') return "회식";
      return "없음";
    }

    // 5-2. 개별 태그 온/오프 토글
    function toggleIndividualTag(tagKey) {
      const wasZeroResult = (getFilteredPlaces().length === 0);

      // 토글 상태 변경
      activeFilters[tagKey] = !activeFilters[tagKey];

      // 행동 로그 누적 기록
      logData.tagToggleLogs.push({
        timestamp: new Date().toISOString(),
        tag: tagKey,
        action: activeFilters[tagKey] ? "ON" : "OFF"
      });

      // 복구 액션 감지 로직
      if (wasZeroResult) {
        const nowCount = getFilteredPlaces().length;
        if (nowCount > 0) {
          // 태그 토글을 통해 결과를 1개 이상으로 살려냈다면 relaxed_filter
          logData.zeroResultRecoveryAction = "relaxed_filter";
        }
      }

      updateDashboard();
    }

    // 5-3. 필터 리셋 (결과 0건 복구용)
    function resetToPresetDefaults() {
      // 0개 결과 복구 액션에 reset_clicked 기록
      logData.zeroResultRecoveryAction = "reset_clicked";

      if (currentPreset) {
        // 현재 프리셋의 기본 조건만 남기고 모두 초기화
        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
        const defaultTags = presetConfig[currentPreset];
        defaultTags.forEach(tag => {
          activeFilters[tag] = true;
        });
      } else {
        // 프리셋마저 없는 초기 상태였다면 전체 필터 오프
        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
      }

      updateDashboard();
    }

    // ----------------------------------------------------
    // 6. 데이터 필터링 및 뷰 업데이트
    // ----------------------------------------------------

    // 6-1. 현재 활성화된 필터 조건에 따른 장소 필터링
    function getFilteredPlaces() {
      // 활성화된 태그 리스트 추출
      const activeTagKeys = Object.keys(activeFilters).filter(k => activeFilters[k]);

      // 필터링 적용 (AND 조건)
      return placesData.filter(place => {
        return activeTagKeys.every(tag => place.parsed_options[tag] === true);
      });
    }

    // 6-2. 대시보드(지도 마커 + 하단 리스트) 일괄 업데이트
    function updateDashboard() {
      const filtered = getFilteredPlaces();

      // 0건 예외 기록 트리거
      if (filtered.length === 0) {
        logData.zeroResultTriggered = true;
      }

      // UI 갱신
      updateUIFilters();
      updateMapMarkers(filtered);
      updatePlacesList(filtered);
    }

    // 6-3. 필터 UI 컴포넌트 상태 갱신 (10개 태그 연동)
    function updateUIFilters() {
      // 프리셋 버튼 활성화 스타일
      Object.keys(presetButtons).forEach(key => {
        if (currentPreset === key) {
          presetButtons[key].classList.add('active');
        } else {
          presetButtons[key].classList.remove('active');
        }
      });

      // 확장 태그 칩 활성화 스타일 (10개 조건 태그 파란색 하이라이트)
      sortedExtendedTagKeys.forEach(key => {
        const el = document.getElementById(`tag-item-${key}`);
        if (el) {
          if (activeFilters[key]) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        }
      });
    }

    // 6-4. 지도 마커 재생성
    function updateMapMarkers(filteredPlaces) {
      // 기존 마커들 삭제
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      filteredPlaces.forEach((place, index) => {
        // 커스텀 DivIcon 정의 (네이버 지도 말풍선)
        const customIcon = L.divIcon({
          className: 'custom-marker',
          html: `<div class="marker-bubble">${place.name}</div>`,
          iconSize: null,
          iconAnchor: [30, 30]
        });

        const marker = L.marker([place.latitude, place.longitude], { icon: customIcon }).addTo(map);

        // 마커 클릭 시 동작
        marker.on('click', () => {
          // 마커 하이라이트 전환
          markers.forEach(m => {
            const el = m.getElement();
            if (el) el.classList.remove('selected-pin');
          });
          const currentEl = marker.getElement();
          if (currentEl) currentEl.classList.add('selected-pin');

          // 마커 클릭 시 바텀시트 자동 펼침
          const bottomSheet = document.getElementById('bottom-sheet');
          if (bottomSheet) {
            bottomSheet.classList.add('expanded');
          }

          // 리스트 스크롤 포커싱 및 카드 하이라이트 효과
          focusPlaceInList(place.name);
        });

        // 템포러리 매핑
        marker.placeName = place.name;
        markers.push(marker);
      });

      // 필터링 결과가 있을 때만 지도의 포커스를 맞춤
      if (filteredPlaces.length > 0) {
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.15));
      }
    }

    // 6-5. 리스트 영역 데이터 렌더링
    function updatePlacesList(filteredPlaces) {
      matchCountEl.textContent = filteredPlaces.length;
      placesListContainer.innerHTML = '';

      if (filteredPlaces.length === 0) {
        // 매칭 결과가 0개인 경우 예외 화면
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-result-container';
        emptyDiv.innerHTML = `
          <div class="empty-icon"><i class="fa-regular fa-face-frown"></i></div>
          <div class="empty-message">조건에 맞는 곳이 없어요.<br>조건을 완화해 보세요.</div>
          <button class="reset-btn" onclick="resetToPresetDefaults()">기본 조건으로 초기화</button>
        `;
        placesListContainer.appendChild(emptyDiv);
        return;
      }

      // 카드 리스트 렌더링
      filteredPlaces.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.id = `place-card-${place.name.replace(/\s+/g, '-')}`;

        // 매칭 배지 HTML 빌드 (현재 켜져 있는 필터 조건과 일치하면 matched 하이라이트 부여)
        let badgesHtml = '';
        Object.keys(place.parsed_options).forEach(key => {
          if (place.parsed_options[key] === true) {
            const isFilterOn = activeFilters[key] === true;
            badgesHtml += `<span class="tag-badge ${isFilterOn ? 'matched' : ''}">#${tagMeta[key]}</span> `;
          }
        });

        card.innerHTML = `
          <div class="place-img-wrapper">
            <img class="place-img" src="${place.image_url}" alt="${place.name}">
          </div>
          <div class="place-info">
            <div class="place-title-row">
              <div class="place-name">${place.name}</div>
              <div class="place-category">${place.category}</div>
            </div>
            <div class="place-tags">
              ${badgesHtml}
            </div>
          </div>
        `;

        card.addEventListener('click', () => {
          openDetailModal(place);
        });

        placesListContainer.appendChild(card);
      });
    }

    // ----------------------------------------------------
    // 7. 인터랙션 상세 연동 (바텀시트 포커스 & 모달 제어)
    // ----------------------------------------------------

    // 7-1. 특정 카드로 리스트 스크롤 포커스 및 하이라이팅
    function focusPlaceInList(placeName) {
      const cardId = `place-card-${placeName.replace(/\s+/g, '-')}`;
      const cardEl = document.getElementById(cardId);

      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        // 이전 하이라이팅 제거 후 재시작
        document.querySelectorAll('.place-card').forEach(c => c.classList.remove('highlighted'));
        cardEl.classList.add('highlighted');
      }
    }

    // 7-2. 장소 상세보기 모달 오픈
    function openDetailModal(place) {
      currentPlaceInDetail = place;

      // 모달 필드 동적 채우기
      detailImg.src = place.image_url;
      detailName.textContent = place.name;
      detailCategory.textContent = place.category;
      detailAddress.textContent = place.address;
      detailPhone.textContent = place.phone;

      // 상세 옵션 10개 전체 그리드 렌더링
      detailOptionsGrid.innerHTML = '';
      Object.keys(place.parsed_options).forEach(key => {
        const isMatched = place.parsed_options[key] === true;
        const pill = document.createElement('div');
        pill.className = `detail-option-pill ${isMatched ? 'active' : ''}`;
        pill.innerHTML = `
          <i class="${isMatched ? 'fa-solid fa-check' : 'fa-solid fa-minus'}" style="color:${isMatched ? 'var(--naver-green)' : 'var(--text-muted)'}"></i>
          <span>${tagMeta[key]}</span>
        `;
        detailOptionsGrid.appendChild(pill);
      });

      // 로깅을 위한 수치 증가 및 타이머 시작
      logData.detailViewCount += 1;
      detailOpenTime = Date.now();

      // 슬라이딩 모달 오픈
      detailModal.classList.add('open');
      detailModal.style.display = 'flex';
    }

    // 7-3. 장소 상세보기 모달 닫기
    function closeDetailModal() {
      // 상세 모달 머문 시간 누적 합산
      if (detailOpenTime) {
        const stayDuration = (Date.now() - detailOpenTime) / 1000.0;
        logData.detailStayDurationSec += stayDuration;
        detailOpenTime = null;
      }

      // 모달 닫기
      detailModal.classList.remove('open');
      detailModal.style.display = 'none';
      currentPlaceInDetail = null;
    }

    // ----------------------------------------------------
    // 8. 최종 선택 및 행동 로그 전송 (구글 시트 연동)
    // ----------------------------------------------------

    function completeTaskWithSelection() {
      if (!currentPlaceInDetail) return;

      // 최종 상세 뷰 시간 누적
      if (detailOpenTime) {
        const stayDuration = (Date.now() - detailOpenTime) / 1000.0;
        logData.detailStayDurationSec += stayDuration;
        detailOpenTime = null;
      }

      // 최종 로그 데이터 조립
      logData.taskEndTime = new Date().toISOString();
      const totalDur = (new Date(logData.taskEndTime) - new Date(logData.taskStartTime)) / 1000.0;
      logData.totalDurationSec = parseFloat(totalDur.toFixed(2));
      logData.finalSelectedPlace = currentPlaceInDetail.name;

      if (logData.zeroResultTriggered && !logData.zeroResultRecoveryAction) {
        logData.zeroResultRecoveryAction = "relaxed_filter";
      }

      // 1. 구글 스프레드시트로 로그 자동 전송 (text/plain 방식)
      fetch(GOOGLE_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(logData)
      })
        .then(() => console.log("구글 스프레드시트로 로그 전송 완료"))
        .catch(err => console.error("Webhook Error:", err));

      // 2. 상세보기 모달 숨기기
      detailModal.classList.remove('open');
      detailModal.style.display = 'none';

      // 3. 인앱 완료 모달 팝업 띄우기
      showCompletionModal(currentPlaceInDetail.name);
    }

    // 인앱 완료 모달 노출 로직
    function showCompletionModal(shopName) {
      if (typeof completionShopName !== 'undefined' && completionShopName) {
        completionShopName.textContent = shopName;
      }
      if (typeof completionModal !== 'undefined' && completionModal) {
        completionModal.style.display = 'flex';
      } else {
        alert("선택이 완료되었습니다: " + shopName);
      }
    }
  </script>
</body>

</html>
