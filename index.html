<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>네이버 지도 - 건대입구역 맛집 탐색</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --naver-green: #03C75A;
      --naver-green-dark: #02b34f;
      --naver-green-light: #e8f9f0;
      --text-main: #1e2022;
      --text-sub: #8f95a0;
      --bg-gray: #f4f6f8;
      --border-color: #e5e8eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121417;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #fff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    @media (min-width: 431px) {
      #app-container {
        height: 92vh;
        border-radius: 36px;
      }
    }

    /* 상단 영역 */
    #header-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 85%, rgba(255,255,255,0) 100%);
      padding: 12px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      border: 2px solid var(--naver-green);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 4px 12px rgba(3,199,90,0.12);
    }

    .search-box i.fa-search {
      color: var(--naver-green);
      font-size: 16px;
      margin-right: 10px;
    }

    .search-box input {
      border: none;
      outline: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      width: 100%;
    }

    /* 프리셋 칩 목록 */
    .preset-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .preset-scroll::-webkit-scrollbar { display: none; }

    .preset-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #4a5056;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.04);
      transition: all 0.2s;
    }

    .preset-chip.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    /* 10개 조건 태그 칩 영역 */
    .tag-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tag-scroll::-webkit-scrollbar { display: none; }

    .filter-tag {
      padding: 5px 11px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-tag.active {
      background: var(--naver-green-light);
      border-color: var(--naver-green);
      color: var(--naver-green-dark);
      font-weight: 700;
    }

    /* 지도 영역 */
    #map-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 핀 말풍선 스타일 (폭 자동 맞춤) */
    .custom-marker {
      background: #fff;
      border: 1.5px solid var(--naver-green);
      border-radius: 18px;
      padding: 4px 10px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.18);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      width: auto !important;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .custom-marker:hover {
      transform: scale(1.08);
    }
    .custom-marker i {
      color: var(--naver-green);
      font-size: 11px;
    }
    .custom-marker span {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 바텀시트 UI */
    #bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1100;
      background: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: flex;
      flex-direction: column;
      max-height: 75vh;
      transform: translateY(calc(100% - 64px));
    }

    #bottom-sheet.expanded {
      transform: translateY(0);
    }

    .sheet-header {
      padding: 10px 16px 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid #f1f3f5;
    }

    .drag-handle {
      width: 40px;
      height: 4px;
      background: #dee2e6;
      border-radius: 2px;
      margin-bottom: 8px;
    }

    .sheet-title-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sheet-count {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .sheet-count span {
      color: var(--naver-green);
    }

    .sheet-body {
      overflow-y: auto;
      padding: 12px 16px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 장소 카드 */
    .place-card {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #edf0f2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: all 0.2s;
    }
    .place-card:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .place-img {
      width: 86px;
      height: 86px;
      border-radius: 10px;
      object-fit: cover;
      background: #e2e8f0;
    }

    .place-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .place-name-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .place-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }
    .place-category {
      font-size: 11px;
      color: var(--text-sub);
    }

    .place-meta {
      font-size: 12px;
      color: #64748b;
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }
    .place-rating {
      color: #f59e0b;
      font-weight: 700;
    }

    .place-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .place-tag-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #64748b;
    }
    .place-tag-badge.matched {
      background: var(--naver-green);
      color: #fff;
      font-weight: 700;
    }

    /* 0개 결과 안내 */
    .zero-result {
      padding: 32px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .zero-result i {
      font-size: 32px;
      color: #cbd5e1;
    }
    .zero-result p {
      font-size: 14px;
      color: #64748b;
    }
    .reset-btn {
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--naver-green);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    /* 상세 뷰 모달 */
    #detail-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1500;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: flex-end;
      flex-direction: column;
    }
    #detail-modal.open {
      display: flex;
    }

    .detail-content {
      background: #fff;
      border-radius: 24px 24px 0 0;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .detail-close-row {
      display: flex;
      justify-content: flex-end;
    }
    .detail-close-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
    }

    .detail-img {
      width: 100%;
      height: 180px;
      border-radius: 16px;
      object-fit: cover;
    }

    .select-place-btn {
      width: 100%;
      padding: 14px;
      background: var(--naver-green);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(3,199,90,0.25);
    }

    /* 완료 안내 모달 */
    #completion-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .completion-card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 20px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .completion-card i {
      font-size: 48px;
      color: var(--naver-green);
    }
    .completion-card h3 {
      font-size: 18px;
      color: var(--text-main);
    }
    .completion-card p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- 상단 바 & 필터 -->
    <div id="header-area">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass fa-search"></i>
        <input type="text" value="건대입구역 맛집" readonly>
      </div>

      <!-- 상황 프리셋 -->
      <div class="preset-scroll">
        <div class="preset-chip" data-preset="family">👨‍👩‍👧 가족모임</div>
        <div class="preset-chip" data-preset="friends">👥 친구모임</div>
        <div class="preset-chip" data-preset="company">💼 회식</div>
      </div>

      <!-- 10개 세부 태그 풀 -->
      <div class="tag-scroll" id="tag-pool">
        <div class="filter-tag" data-tag="parking">주차가능</div>
        <div class="filter-tag" data-tag="group_seats">단체석</div>
        <div class="filter-tag" data-tag="high_chair">유아의자</div>
        <div class="filter-tag" data-tag="room">개별룸</div>
        <div class="filter-tag" data-tag="reservation">예약가능</div>
        <div class="filter-tag" data-tag="conversation">대화하기좋은</div>
        <div class="filter-tag" data-tag="comfortable_seat">편한좌석</div>
        <div class="filter-tag" data-tag="pet_friendly">반려동물</div>
        <div class="filter-tag" data-tag="liquor_available">주류/콜키지</div>
        <div class="filter-tag" data-tag="late_night_early">심야/이른영업</div>
      </div>
    </div>

    <!-- Leaflet 지도 -->
    <div id="map-wrapper">
      <div id="map"></div>
    </div>

    <!-- 하단 바텀시트 -->
    <div id="bottom-sheet">
      <div class="sheet-header" id="sheet-header">
        <div class="drag-handle"></div>
        <div class="sheet-title-row">
          <div class="sheet-count">검색결과 <span id="place-count">22</span>건</div>
          <i class="fa-solid fa-chevron-up" id="sheet-arrow" style="font-size:12px; color:#8f95a0;"></i>
        </div>
      </div>
      <div class="sheet-body" id="places-list"></div>
    </div>

    <!-- 상세 모달 -->
    <div id="detail-modal">
      <div class="detail-content">
        <div class="detail-close-row">
          <button class="detail-close-btn" id="close-detail-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <img src="" id="detail-img" class="detail-img" alt="">
        <div>
          <h2 id="detail-name" style="font-size:20px; font-weight:700;"></h2>
          <p id="detail-category" style="font-size:13px; color:#64748b; margin-top:2px;"></p>
        </div>
        <div id="detail-tags" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
        <p id="detail-desc" style="font-size:14px; color:#334155; line-height:1.6;"></p>
        <button class="select-place-btn" id="select-place-btn">이 장소로 선택</button>
      </div>
    </div>

    <!-- 완료 알림 모달 -->
    <div id="completion-modal">
      <div class="completion-card">
        <i class="fa-solid fa-circle-check"></i>
        <h3>장소 선택이 완료되었습니다!</h3>
        <p>선택하신 매장: <br><strong id="completed-shop-name" style="color:#03C75A; font-size:16px;"></strong></p>
        <p style="font-size:12px; color:#94a3b8; margin-top:8px;">실험 데이터가 구글 스프레드시트에 정상 기록되었습니다.<br>참여해 주셔서 감사합니다.</p>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

      { id: 18, name: "새마을식당 건대점", category: "육류,고기요리", lat: 37.5411, lng: 127.0695, rating: 4.5, reviews: 1100, img: "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=500&auto=format&fit=crop", tags: ["group_seats", "late_night_early", "liquor_available"], desc: "열탄불고기와 7분돼지김치찌개로 가성비 높은 단체 회식이 가능한 식당입니다." },
      { id: 19, name: "쿠히치 건대점", category: "이자카야", lat: 37.5424, lng: 127.0682, rating: 4.8, reviews: 870, img: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&auto=format&fit=crop", tags: ["room", "conversation", "comfortable_seat", "liquor_available", "late_night_early"], desc: "감성적인 프라이빗 룸과 정갈한 일식 안주를 갖추어 심야 데이트 및 모임에 좋습니다." },
      { id: 20, name: "정면 (건대점)", category: "국수", lat: 37.5445, lng: 127.0712, rating: 4.9, reviews: 520, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&auto=format&fit=crop", tags: ["conversation"], desc: "미쉐린 가이드 선정 맑은 백탕 쌀국수로 조용하고 깊이 있는 한 끼를 선사합니다." },
      { id: 21, name: "팔각도 건대관", category: "닭특수부위", lat: 37.5405, lng: 127.0688, rating: 4.7, reviews: 960, img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=500&auto=format&fit=crop", tags: ["group_seats", "reservation", "comfortable_seat"], desc: "특허받은 팔각 불판에 구워내는 숯불 닭갈비 전문점으로 단체 모임에 인기입니다." },
      { id: 22, name: "플레이그라운드 브런치카페", category: "브런치", lat: 37.5389, lng: 127.0702, rating: 4.7, reviews: 410, img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500&auto=format&fit=crop", tags: ["pet_friendly", "conversation", "comfortable_seat"], desc: "반려견과 함께 여유롭게 브런치와 커피를 즐길 수 있는 힐링 공간입니다." }
    ];

    const tagNames = {
      parking: "주차가능",
      group_seats: "단체석",
      high_chair: "유아의자",
      room: "개별룸",
      reservation: "예약가능",
      conversation: "대화하기좋은",
      comfortable_seat: "편한좌석",
      pet_friendly: "반려동물",
      liquor_available: "주류/콜키지",
      late_night_early: "심야/이른영업"
    };

    // ----------------------------------------------------
    // 2. 실험 행동 로그 데이터 구조
    // ----------------------------------------------------
    const logData = {
      sessionId: "session_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
      taskStartTime: new Date().toISOString(),
      taskEndTime: null,
      totalDurationSec: 0,
      selectedPreset: null,
      tagToggleLogs: [],
      zeroResultTriggered: false,
      zeroResultRecoveryAction: null,
      detailViewCount: 0,
      detailStayDurationSec: 0,
      finalSelectedPlace: null
    };

    let activeTags = new Set();
    let detailOpenTime = null;
    let currentPlaceInDetail = null;
    let markersLayer = null;
    let map = null;

    // ----------------------------------------------------
    // 3. 지도 초기화
    // ----------------------------------------------------
    function initMap() {
      map = L.map('map', {
        center: [37.5404, 127.0692],
        zoom: 16,
        zoomControl: false
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB',
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      // 타일 깨짐 방지
      setTimeout(() => {
        map.invalidateSize();
      }, 200);
    }

    // ----------------------------------------------------
    // 4. 장소 렌더링 & 지도 핀 업데이트
    // ----------------------------------------------------
    function render() {
      const placesList = document.getElementById('places-list');
      const countEl = document.getElementById('place-count');
      markersLayer.clearLayers();
      placesList.innerHTML = '';

      // 필터링 (AND 매칭)
      const filtered = placesData.filter(place => {
        for (let tag of activeTags) {
          if (!place.tags.includes(tag)) return false;
        }
        return true;
      });

      countEl.textContent = filtered.length;

      // 0건 발생 시
      if (filtered.length === 0) {
        if (!logData.zeroResultTriggered) {
          logData.zeroResultTriggered = true;
        }
        placesList.innerHTML = `
          <div class="zero-result">
            <i class="fa-solid fa-circle-exclamation"></i>
            <p>선택하신 조건에 딱 맞는 장소가 없습니다.<br>필터를 조금 완화해 보세요.</p>
            <button class="reset-btn" id="reset-filter-btn">필터 초기화</button>
          </div>
        `;
        document.getElementById('reset-filter-btn').addEventListener('click', () => {
          logData.zeroResultRecoveryAction = "reset_all";
          activeTags.clear();
          document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
          logData.selectedPreset = null;
          render();
        });
        return;
      }

      // 목록 및 지도 핀 생성
      filtered.forEach(place => {
        // 지도 핀 (말풍선 자동 너비)
        const customIcon = L.divIcon({
          className: 'custom-div-icon',
          html: `<div class="custom-marker"><i class="fa-solid fa-location-dot"></i><span>${place.name}</span></div>`,
          iconSize: null,
          iconAnchor: [30, 20]
        });

        const marker = L.marker([place.lat, place.lng], { icon: customIcon });
        marker.on('click', () => {
          openDetailModal(place);
        });
        markersLayer.addLayer(marker);

        // 하단 카드
        const card = document.createElement('div');
        card.className = 'place-card';
        
        const tagsHtml = place.tags.map(t => {
          const isMatched = activeTags.has(t);
          return `<span class="place-tag-badge ${isMatched ? 'matched' : ''}">#${tagNames[t] || t}</span>`;
        }).join('');

        card.innerHTML = `
          <img src="${place.img}" class="place-img" alt="${place.name}">
          <div class="place-info">
            <div>
              <div class="place-name-row">
                <span class="place-name">${place.name}</span>
                <span class="place-category">${place.category}</span>
              </div>
              <div class="place-meta">
                <span class="place-rating"><i class="fa-solid fa-star"></i> ${place.rating}</span>
                <span>리뷰 ${place.reviews}</span>
              </div>
            </div>
            <div class="place-tags">${tagsHtml}</div>
          </div>
        `;

        card.addEventListener('click', () => {
          openDetailModal(place);
        });

        placesList.appendChild(card);
      });
    }

    // ----------------------------------------------------
    // 5. 상세 모달 열기/닫기
    // ----------------------------------------------------
    function openDetailModal(place) {
      currentPlaceInDetail = place;
      detailOpenTime = Date.now();
      logData.detailViewCount += 1;

      document.getElementById('detail-img').src = place.img;
      document.getElementById('detail-name').textContent = place.name;
      document.getElementById('detail-category').textContent = `${place.category} · 평점 ${place.rating}`;
      document.getElementById('detail-desc').textContent = place.desc;

      const tagsContainer = document.getElementById('detail-tags');
      tagsContainer.innerHTML = place.tags.map(t => {
        const isMatched = activeTags.has(t);
        return `<span class="place-tag-badge ${isMatched ? 'matched' : ''}" style="font-size:12px; padding:4px 8px;">#${tagNames[t] || t}</span>`;
      }).join('');

      document.getElementById('detail-modal').classList.add('open');
    }

    function closeDetailModal() {
      if (detailOpenTime) {
        logData.detailStayDurationSec += (Date.now() - detailOpenTime) / 1000.0;
        detailOpenTime = null;
      }
      document.getElementById('detail-modal').classList.remove('open');
      currentPlaceInDetail = null;
    }

    // ----------------------------------------------------
    // 6. 프리셋 및 태그 인터랙션
    // ----------------------------------------------------
    const presetMapping = {
      family: ['parking', 'group_seats', 'high_chair'],
      friends: ['conversation', 'comfortable_seat'],
      company: ['group_seats', 'room', 'reservation']
    };

    // 프리셋 클릭
    document.querySelectorAll('.preset-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const preset = chip.getAttribute('data-preset');
        const isAlreadyActive = chip.classList.contains('active');

        document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('active'));
        activeTags.clear();

        if (!isAlreadyActive) {
          chip.classList.add('active');
          logData.selectedPreset = preset;
          presetMapping[preset].forEach(t => activeTags.add(t));
        } else {
          logData.selectedPreset = null;
        }

        // 상단 10개 태그 UI 실시간 동기화
        document.querySelectorAll('.filter-tag').forEach(tagEl => {
          const t = tagEl.getAttribute('data-tag');
          if (activeTags.has(t)) {
            tagEl.classList.add('active');
          } else {
            tagEl.classList.remove('active');
          }
        });

        logData.tagToggleLogs.push({
          timestamp: new Date().toISOString(),
          type: "preset_click",
          preset: isAlreadyActive ? null : preset,
          currentActiveTags: Array.from(activeTags)
        });

        render();
      });
    });

    // 개별 태그 클릭 토글
    document.querySelectorAll('.filter-tag').forEach(tagEl => {
      tagEl.addEventListener('click', () => {
        const tag = tagEl.getAttribute('data-tag');
        
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
          tagEl.classList.remove('active');
        } else {
          activeTags.add(tag);
          tagEl.classList.add('active');
        }

        logData.tagToggleLogs.push({
          timestamp: new Date().toISOString(),
          type: "tag_toggle",
          tag: tag,
          state: activeTags.has(tag) ? "ON" : "OFF",
          currentActiveTags: Array.from(activeTags)
        });

        render();
      });
    });

    // ----------------------------------------------------
    // 7. 바텀시트 펼침/접힘 제어
    // ----------------------------------------------------
    const bottomSheet = document.getElementById('bottom-sheet');
    const sheetHeader = document.getElementById('sheet-header');
    const sheetArrow = document.getElementById('sheet-arrow');

    sheetHeader.addEventListener('click', () => {
      bottomSheet.classList.toggle('expanded');
      if (bottomSheet.classList.contains('expanded')) {
        sheetArrow.classList.replace('fa-chevron-up', 'fa-chevron-down');
      } else {
        sheetArrow.classList.replace('fa-chevron-down', 'fa-chevron-up');
      }
    });

    // ----------------------------------------------------
    // 8. 최종 선택 및 구글 시트 웹훅 전송
    // ----------------------------------------------------
    function completeTaskWithSelection() {
      if (!currentPlaceInDetail) return;

      if (detailOpenTime) {
        logData.detailStayDurationSec += (Date.now() - detailOpenTime) / 1000.0;
        detailOpenTime = null;
      }

      logData.taskEndTime = new Date().toISOString();
      const totalDur = (new Date(logData.taskEndTime) - new Date(logData.taskStartTime)) / 1000.0;
      logData.totalDurationSec = parseFloat(totalDur.toFixed(2));
      logData.finalSelectedPlace = currentPlaceInDetail.name;

      if (logData.zeroResultTriggered && !logData.zeroResultRecoveryAction) {
        logData.zeroResultRecoveryAction = "relaxed_filter";
      }

      // 구글 시트로 백그라운드 POST 전송 (no-cors / text/plain 모드)
      fetch(GOOGLE_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(logData)
      })
      .then(() => console.log("Google Sheets Log Sent Successfully"))
      .catch(err => console.error("Webhook Error:", err));

      // UI 처리: 모달 전환
      const placeName = currentPlaceInDetail.name;
      closeDetailModal();
      document.getElementById('completed-shop-name').textContent = placeName;
      document.getElementById('completion-modal').style.display = 'flex';
    }

    // ----------------------------------------------------
    // 이벤트 바인딩 및 앱 실행
    // ----------------------------------------------------
    document.getElementById('close-detail-btn').addEventListener('click', closeDetailModal);
    document.getElementById('select-place-btn').addEventListener('click', completeTaskWithSelection);

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      render();
    });
  </script>
</body>
