<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>네이버 지도 - 건대입구역 맛집 탐색</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Google Fonts & Icon -->
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@400;600;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --naver-green: #03C75A;
      --naver-green-dark: #02b34f;
      --naver-green-light: #e8f9f0;
      --coral: #ef6255;
      --coral-light: #fff0ee;
      --bg-gray: #f4f6fa;
      --text-main: #1e1e23;
      --text-sub: #707077;
      --text-muted: #9898a0;
      --border-light: #ebebeb;
      --font-main: 'Noto Sans KR', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-main);
      background-color: #1a1a24;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .phone-container {
      width: 100%;
      max-width: 430px;
      height: 900px;
      max-height: 95vh;
      background-color: #fff;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border-radius: 40px;
      border: 8px solid #2d2d3a;
    }

    @media (max-width: 480px) {
      body { background-color: #fff; }
      .phone-container {
        max-width: 100%;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        border: none;
      }
    }

    .phone-header-bar {
      height: 36px;
      background-color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 600;
      color: #000;
      z-index: 1000;
      border-bottom: 1px solid var(--border-light);
    }

    .phone-header-bar .status-icons i { margin-left: 5px; }

    .app-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-gray);
    }

    .search-section {
      background-color: #fff;
      padding: 12px 16px 8px 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      z-index: 110;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background-color: #fff;
      border: 2px solid var(--naver-green);
      border-radius: 8px;
      height: 46px;
      padding: 0 12px;
      gap: 10px;
    }

    .search-bar .back-btn {
      color: var(--naver-green);
      font-size: 18px;
      cursor: pointer;
    }

    .search-input {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      border: none;
      outline: none;
      background: transparent;
      pointer-events: none;
    }

    .search-icons {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--naver-green);
      font-size: 16px;
    }

    .filter-section {
      background-color: #fff;
      padding: 4px 16px 12px 16px;
      z-index: 110;
      border-bottom: 1px solid var(--border-light);
    }

    .preset-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .preset-chips::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 20px;
      border: 1px solid #e0e0e6;
      background-color: #fff;
      font-size: 13px;
      font-weight: 500;
      color: #4e4e55;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chip.active {
      background-color: var(--naver-green-light);
      border-color: var(--naver-green);
      color: var(--naver-green);
      font-weight: 700;
    }

    .chip-add {
      background-color: #f5f5f7;
      border-color: #e5e5eb;
    }
    .chip-add i {
      font-size: 11px;
      transition: transform 0.2s;
    }
    .chip-add.active i { transform: rotate(45deg); }

    .expanded-tags-container {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
      background-color: #f9fafc;
      border-bottom: 0 solid var(--border-light);
      z-index: 109;
    }

    .expanded-tags-container.open {
      max-height: 180px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      overflow-y: auto;
    }

    .tags-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-item {
      padding: 6px 12px;
      border-radius: 16px;
      background-color: #fff;
      border: 1px solid #e2e2eb;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tag-item.active {
      background-color: var(--naver-green-light);
      border-color: var(--naver-green);
      color: var(--naver-green-dark);
      font-weight: 700;
    }

    .map-container {
      flex: 1;
      position: relative;
      z-index: 10;
    }

    #map { width: 100%; height: 100%; }

    /* 말풍선 마커 (완전 일치: 그린 / 부분 일치: 코랄) */
    .custom-marker { background: none; border: none; }
    .marker-bubble {
      position: relative;
      background-color: #fff;
      border: 2px solid var(--naver-green);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -100%);
      width: auto;
      min-width: 50px;
      max-width: 150px;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .marker-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: var(--naver-green) transparent;
      display: block;
      width: 0;
    }

    .marker-bubble::before {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0;
      border-style: solid;
      border-color: #fff transparent;
      display: block;
      width: 0;
      z-index: 1;
    }

    /* 부분 일치 핀 스타일 */
    .custom-marker.partial-pin .marker-bubble {
      border-color: var(--coral);
      color: #991b1b;
    }
    .custom-marker.partial-pin .marker-bubble::after {
      border-color: var(--coral) transparent;
    }

    /* 선택된 핀 스타일 */
    .custom-marker.selected-pin .marker-bubble {
      background-color: #1e293b;
      border-color: #0f172a;
      color: #fff;
      z-index: 999;
      transform: translate(-50%, -100%) scale(1.1);
    }
    .custom-marker.selected-pin .marker-bubble::after { border-color: #0f172a transparent; }
    .custom-marker.selected-pin .marker-bubble::before { border-color: #1e293b transparent; }

    /* 제스처 지원 바텀시트 */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70%;
      max-height: 80vh;
      background-color: #fff;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
      z-index: 105;
      display: flex;
      flex-direction: column;
      transform: translateY(calc(100% - 68px));
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bottom-sheet.expanded {
      transform: translateY(0);
    }

    .sheet-handle-bar {
      height: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      touch-action: none;
    }
    .sheet-handle-bar:active { cursor: grabbing; }

    .sheet-handle {
      width: 40px;
      height: 4.5px;
      background-color: #d1d5db;
      border-radius: 3px;
    }

    .sheet-header {
      padding: 0 20px 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .sheet-header-title {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 500;
    }
    .sheet-header-title span {
      color: var(--naver-green);
      font-weight: 700;
    }

    .places-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 20px 16px;
    }

    /* 결과 그룹 헤더 (모두 일치 / 일부 일치) */
    .result-group-title {
      font-size: 13px;
      font-weight: 700;
      color: #475569;
      margin: 14px 0 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-group-title span {
      color: var(--naver-green);
      font-weight: 800;
    }
    .result-group-title.partial span {
      color: var(--coral);
    }

    .place-card {
      display: flex;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
      cursor: pointer;
      gap: 14px;
      border-radius: 8px;
    }
    .place-card:last-child { border-bottom: none; }

    .place-img-wrapper {
      width: 92px;
      height: 92px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      background-color: #eef1f6;
    }

    .place-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .place-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .place-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .place-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .place-category {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .place-score-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-top: 2px;
    }
    .place-score {
      color: #f59e0b;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .place-reviews { color: var(--text-muted); font-size: 11px; }

    .place-menu-row {
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .place-review-snippet {
      font-size: 11px;
      color: #64748b;
      background-color: #f8fafc;
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 5px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      border: 1px solid #edf2f7;
    }

    .place-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .tag-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      background-color: #f0f0f4;
      color: #55555e;
      font-weight: 500;
    }

    .tag-badge.matched {
      background-color: var(--naver-green) !important;
      color: #fff !important;
      font-weight: 700 !important;
    }

    .tag-badge.missing {
      background-color: var(--coral-light) !important;
      color: var(--coral) !important;
    }

    .empty-result-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      text-align: center;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      margin: 10px 0;
    }

    .empty-icon {
      font-size: 32px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .empty-message {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .reset-btn {
      padding: 8px 16px;
      border-radius: 20px;
      background-color: var(--naver-green);
      color: #fff;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(3, 199, 90, 0.2);
    }

    .detail-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      z-index: 300;
      display: none;
      flex-direction: column;
    }

    .detail-modal.open {
      display: flex;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .detail-header {
      position: relative;
      height: 180px;
      background-color: #eef1f6;
    }

    .detail-header-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .close-modal-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      z-index: 10;
    }

    .detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .detail-meta {
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 16px;
    }

    .detail-title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .detail-name {
      font-size: 20px;
      font-weight: 900;
      color: var(--text-main);
    }

    .detail-category {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .detail-score-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin-top: 4px;
    }

    .detail-review-highlight {
      background: #f8fafc;
      border-left: 3px solid var(--naver-green);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      font-size: 13px;
      color: #334155;
      line-height: 1.5;
      margin: 14px 0;
    }

    .detail-info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .detail-info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: #3f3f46;
      line-height: 1.4;
    }

    .detail-info-item i {
      width: 16px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .detail-options-section { margin-bottom: 20px; }

    .detail-section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .detail-options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .detail-option-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      background-color: var(--bg-gray);
      color: var(--text-sub);
    }

    .detail-option-pill.active {
      background-color: var(--naver-green-light);
      color: var(--naver-green);
      font-weight: 600;
    }

    .detail-footer-btn-container {
      padding: 14px 20px;
      border-top: 1px solid var(--border-light);
      background-color: #fff;
      display: flex;
      gap: 12px;
    }

    .select-place-btn {
      flex: 1;
      height: 48px;
      border-radius: 8px;
      background-color: var(--naver-green);
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(3, 199, 90, 0.25);
    }

    .cancel-place-btn {
      width: 90px;
      height: 48px;
      border-radius: 8px;
      background-color: #f4f4f5;
      color: #4e4e55;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .completion-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .completion-content {
      background: #fff;
      padding: 32px 24px;
      border-radius: 16px;
      width: 85%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .completion-icon {
      font-size: 40px;
      color: var(--naver-green);
      margin-bottom: 16px;
    }

    .completion-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .completion-msg {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .completion-shop {
      font-size: 15px;
      font-weight: 700;
      color: var(--naver-green);
      background-color: var(--naver-green-light);
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .completion-btn {
      width: 100%;
      height: 48px;
      border-radius: 8px;
      background-color: var(--naver-green);
      color: #fff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="phone-container">
    <div class="phone-header-bar">
      <div class="time-status">12:30</div>
      <div class="status-icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-three-quarters"></i>
      </div>
    </div>

    <div class="app-body">
      <section class="search-section">
        <div class="search-bar">
          <i class="fa-solid fa-arrow-left back-btn"></i>
          <input type="text" class="search-input" value="건대입구역 맛집">
          <div class="search-icons">
            <i class="fa-solid fa-xmark" style="color:#a8a8af; font-size:14px;"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>
      </section>

      <section class="filter-section">
        <div class="preset-chips">
          <button class="chip" id="preset-family" data-preset="family">👨‍👩‍👧 가족모임</button>
          <button class="chip" id="preset-friends" data-preset="friends">👥 친구모임</button>
          <button class="chip" id="preset-dinner" data-preset="dinner">💼 회식</button>
          <button class="chip chip-add" id="toggle-tags-btn"><i class="fa-solid fa-plus"></i> 조건 추가</button>
        </div>
      </section>

      <section class="expanded-tags-container" id="expanded-tags-panel">
        <div class="tags-grid" id="tags-grid-container"></div>
      </section>

      <div class="map-container">
        <div id="map"></div>
      </div>

      <div class="bottom-sheet" id="bottom-sheet">
        <div class="sheet-handle-bar" id="sheet-handle">
          <div class="sheet-handle"></div>
        </div>
        <div class="sheet-header" id="sheet-header">
          <div class="sheet-header-title">검색결과 <span id="match-count">0</span>건</div>
          <i class="fa-solid fa-chevron-up" id="sheet-arrow" style="font-size:12px; color:#8f95a0;"></i>
        </div>
        <div class="places-list" id="places-list-container"></div>
      </div>

      <div class="detail-modal" id="detail-modal">
        <div class="detail-header">
          <img class="detail-header-img" id="detail-img" src="" alt="식당 전경">
          <button class="close-modal-btn" id="close-modal-btn">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="detail-content">
          <div class="detail-meta">
            <div class="detail-title-row">
              <h2 class="detail-name" id="detail-name">식당 이름</h2>
              <span class="detail-category" id="detail-category">일식</span>

    function renderExtendedTags() {
      tagsGridContainer.innerHTML = '';
      sortedExtendedTagKeys.forEach(key => {
        const btn = document.createElement('button');

        tagsGridContainer.appendChild(btn);
      });

    function setupEventListeners() {
      Object.keys(presetButtons).forEach(presetKey => {
        presetButtons[presetKey].addEventListener('click', () => {
          selectPreset(presetKey);
        });
      });

      toggleTagsBtn.addEventListener('click', () => {

      });

      });

    // 터치/마우스 제스처 바텀시트
    function setupBottomSheetGestures() {
      const bottomSheet = document.getElementById('bottom-sheet');
      const sheetHandleBar = document.getElementById('sheet-handle');
      const sheetHeader = document.getElementById('sheet-header');
      const sheetArrow = document.getElementById('sheet-arrow');

      let startY = 0;
      let isDragging = false;

      function toggleSheet() {
        bottomSheet.classList.toggle('expanded');
        if (bottomSheet.classList.contains('expanded')) {
          sheetArrow.classList.replace('fa-chevron-up', 'fa-chevron-down');
        } else {
          sheetArrow.classList.replace('fa-chevron-down', 'fa-chevron-up');
        }
      }

      sheetHeader.addEventListener('click', toggleSheet);

      sheetHandleBar.addEventListener('pointerdown', (e) => {
        startY = e.clientY;
        isDragging = true;
        sheetHandleBar.setPointerCapture(e.pointerId);
      });

      sheetHandleBar.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaY = e.clientY - startY;
        if (deltaY < -40) {
          bottomSheet.classList.add('expanded');
          sheetArrow.classList.replace('fa-chevron-up', 'fa-chevron-down');
        } else if (deltaY > 40) {
          bottomSheet.classList.remove('expanded');
          sheetArrow.classList.replace('fa-chevron-down', 'fa-chevron-up');
        }
      });

      sheetHandleBar.addEventListener('pointerup', () => { isDragging = false; });
      sheetHandleBar.addEventListener('pointercancel', () => { isDragging = false; });
    }

    function selectPreset(presetKey) {
      let wasZeroResult = (getGroupedPlaces().full.length === 0);

      if (currentPreset === presetKey) {
        currentPreset = null;
        logData.selectedPreset = "없음";
        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
      } else {
        currentPreset = presetKey;
        logData.selectedPreset = translatePresetName(presetKey);

        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
        const presetTags = presetConfig[presetKey];
        presetTags.forEach(tag => {
          activeFilters[tag] = true;
        });

        expandedTagsPanel.classList.add('open');
        toggleTagsBtn.classList.add('active');
      }

      if (wasZeroResult) {
        const nowCount = getGroupedPlaces().full.length;
        if (nowCount > 0) {
          logData.zeroResultRecoveryAction = "reset_clicked";
        }
      }

      updateDashboard();
    }

    function translatePresetName(key) {
      if (key === 'family') return "가족모임";
      if (key === 'friends') return "친구모임";
      if (key === 'dinner') return "회식";
      return "없음";
    }

    function toggleIndividualTag(tagKey) {
      const wasZeroResult = (getGroupedPlaces().full.length === 0);

      activeFilters[tagKey] = !activeFilters[tagKey];

      logData.tagToggleLogs.push({
        timestamp: new Date().toISOString(),
        tag: tagKey,
        action: activeFilters[tagKey] ? "ON" : "OFF"
      });

      if (wasZeroResult) {
        const nowCount = getGroupedPlaces().full.length;
        if (nowCount > 0) {
          logData.zeroResultRecoveryAction = "relaxed_filter";
        }
      }

      updateDashboard();
    }

    function resetToPresetDefaults() {
      logData.zeroResultRecoveryAction = "reset_clicked";

      if (currentPreset) {
        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
        const defaultTags = presetConfig[currentPreset];
        defaultTags.forEach(tag => {
          activeFilters[tag] = true;
        });
      } else {
        Object.keys(activeFilters).forEach(k => activeFilters[k] = false);
      }

      updateDashboard();
    }

    // 완전 일치(full) vs 부분 일치(partial) 계산
    function getGroupedPlaces() {
      const activeKeys = Object.keys(activeFilters).filter(k => activeFilters[k]);

      if (activeKeys.length === 0) {
        return { full: placesData, partial: [] };
      }

      const full = [];
      const partial = [];

      placesData.forEach(place => {
        let matchCount = 0;
        activeKeys.forEach(tag => {
          if (place.parsed_options[tag] === true) matchCount++;
        });

        if (matchCount === activeKeys.length) {
          full.push(place);
        } else if (matchCount > 0) {
          partial.push({ place, matchCount });
        }
      });

      // 부분 일치는 많이 일치한 순서대로 정렬
      partial.sort((a, b) => b.matchCount - a.matchCount);

      return {
        full,
        partial: partial.map(item => item.place)
      };
    }

    function updateDashboard() {
      const { full, partial } = getGroupedPlaces();

      if (full.length === 0) {
        logData.zeroResultTriggered = true;
      }

      updateUIFilters();
      updateMapMarkers(full, partial);
      updatePlacesList(full, partial);
    }

    function updateUIFilters() {
      Object.keys(presetButtons).forEach(key => {
        if (currentPreset === key) {
          presetButtons[key].classList.add('active');
        } else {
          presetButtons[key].classList.remove('active');
        }
      });

      sortedExtendedTagKeys.forEach(key => {
        const el = document.getElementById(`tag-item-${key}`);
        if (el) {
          if (activeFilters[key]) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        }
      });
    }

    function updateMapMarkers(fullPlaces, partialPlaces) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const activeKeys = Object.keys(activeFilters).filter(k => activeFilters[k]);

      // 1. 완전 일치 마커 렌더링 (그린)
      fullPlaces.forEach(place => {
        const customIcon = L.divIcon({
          className: 'custom-marker',
          html: `<div class="marker-bubble">${place.name}</div>`,
          iconSize: null,
          iconAnchor: [30, 30]
        });

        const marker = L.marker([place.latitude, place.longitude], { icon: customIcon }).addTo(map);
        marker.on('click', () => {
          highlightSelectedPin(marker);
          document.getElementById('bottom-sheet').classList.add('expanded');
          focusPlaceInList(place.name);
        });
        marker.placeName = place.name;
        markers.push(marker);
      });

      // 2. 부분 일치 마커 렌더링 (필터가 켜져 있을 때만 코랄색 핀으로 서브 노출)
      if (activeKeys.length > 0) {
        partialPlaces.forEach(place => {
          const customIcon = L.divIcon({
            className: 'custom-marker partial-pin',
            html: `<div class="marker-bubble"><small style="font-size:9px; color:#ef6255; margin-right:3px;">●</small>${place.name}</div>`,
            iconSize: null,
            iconAnchor: [30, 30]
          });

          const marker = L.marker([place.latitude, place.longitude], { icon: customIcon }).addTo(map);
          marker.on('click', () => {
            highlightSelectedPin(marker);
            document.getElementById('bottom-sheet').classList.add('expanded');
            focusPlaceInList(place.name);
          });
          marker.placeName = place.name;
          markers.push(marker);
        });
      }

      if (fullPlaces.length > 0 || partialPlaces.length > 0) {
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.15));
      }
    }

    function highlightSelectedPin(targetMarker) {
      markers.forEach(m => {
        const el = m.getElement();
        if (el) el.classList.remove('selected-pin');
      });
      const currentEl = targetMarker.getElement();
      if (currentEl) currentEl.classList.add('selected-pin');
    }

    function createPlaceCardHTML(place, isPartial) {
      const activeKeys = Object.keys(activeFilters).filter(k => activeFilters[k]);
      let badgesHtml = '';

      Object.keys(place.parsed_options).forEach(key => {
        if (place.parsed_options[key] === true) {
          const isFilterOn = activeFilters[key] === true;
          badgesHtml += `<span class="tag-badge ${isFilterOn ? 'matched' : ''}">#${tagMeta[key]}</span> `;
        }
      });

      // 부분 일치일 경우 미충족 태그 표시
      if (isPartial) {
        activeKeys.forEach(tag => {
          if (!place.parsed_options[tag]) {
            badgesHtml += `<span class="tag-badge missing">#${tagMeta[tag]} 제외</span> `;
          }
        });
      }

      return `
        <div class="place-card" id="place-card-${place.name.replace(/\s+/g, '-')}" onclick="openDetailModalByName('${place.name.replace(/'/g, "\\'")}')">
          <div class="place-img-wrapper">
            <img class="place-img" src="${place.image_url}" alt="${place.name}">

                <span class="place-category">${place.category}</span>
              </div>

                <span class="place-score"><i class="fa-solid fa-star"></i> ${place.rating}</span>
                <span class="place-reviews">리뷰 ${place.review_count.toLocaleString()}</span>
              </div>
              <div class="place-menu-row">🍴 ${place.signature_menu}</div>
              <div class="place-review-snippet">"${place.highlight_review}"</div>
            </div>
            <div class="place-tags">
              ${badgesHtml}
            </div>
          </div>
        </div>
      `;
    }

    function updatePlacesList(fullPlaces, partialPlaces) {
      matchCountEl.textContent = fullPlaces.length;
      placesListContainer.innerHTML = '';
      const activeKeys = Object.keys(activeFilters).filter(k => activeFilters[k]);

      // 1. 조건을 모두 만족하는 그룹
      if (fullPlaces.length > 0) {
        if (activeKeys.length > 0) {
          const groupHeader = document.createElement('div');
          groupHeader.className = 'result-group-title';
          groupHeader.innerHTML = `조건을 모두 만족해요 <span>${fullPlaces.length}곳</span>`;
          placesListContainer.appendChild(groupHeader);
        }

        fullPlaces.forEach(place => {
          placesListContainer.insertAdjacentHTML('beforeend', createPlaceCardHTML(place, false));
        });
      } else {
        // 완전 일치 0건 시 dead-end 방지 안내
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty-result-container';
        emptyDiv.innerHTML = `
          <div class="empty-icon"><i class="fa-regular fa-face-frown"></i></div>
          <div class="empty-message">선택하신 모든 조건에 딱 맞는 곳이 없습니다.<br>조건을 완화하거나 아래 대체 장소를 확인해보세요.</div>
          <button class="reset-btn" onclick="resetToPresetDefaults()">기본 조건으로 초기화</button>
        `;
        placesListContainer.appendChild(emptyDiv);
      }

      // 2. 일부 조건 만족 그룹 (태그가 켜져 있고 대안 매장이 있을 때)
      if (activeKeys.length > 0 && partialPlaces.length > 0) {
        const partialGroupHeader = document.createElement('div');
        partialGroupHeader.className = 'result-group-title partial';
        partialGroupHeader.innerHTML = `일부 조건이 맞아요 <span>${partialPlaces.length}곳</span>`;
        placesListContainer.appendChild(partialGroupHeader);

        partialPlaces.forEach(place => {
          placesListContainer.insertAdjacentHTML('beforeend', createPlaceCardHTML(place, true));
        });
      }
    }

    function focusPlaceInList(placeName) {
      const cardId = `place-card-${placeName.replace(/\s+/g, '-')}`;
      const cardEl = document.getElementById(cardId);

      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function openDetailModalByName(placeName) {
      const place = placesData.find(p => p.name === placeName);
      if (place) openDetailModal(place);
    }

    function openDetailModal(place) {
      currentPlaceInDetail = place;

      detailImg.src = place.image_url;
      detailName.textContent = place.name;
      detailCategory.textContent = place.category;
      detailRating.textContent = place.rating;
      detailReviewCount.textContent = `리뷰 ${place.review_count.toLocaleString()}개`;
      detailHighlightReview.textContent = `"${place.highlight_review}"`;
      detailMenu.textContent = place.signature_menu;
      detailAddress.textContent = place.address;
      detailPhone.textContent = place.phone;

      detailOptionsGrid.innerHTML = '';
      Object.keys(place.parsed_options).forEach(key => {
        const isMatched = place.parsed_options[key] === true;
        const pill = document.createElement('div');
        pill.className = `detail-option-pill ${isMatched ? 'active' : ''}`;
        pill.innerHTML = `
          <i class="${isMatched ? 'fa-solid fa-check' : 'fa-solid fa-minus'}" style="color:${isMatched ? 'var(--naver-green)' : 'var(--text-muted)'}"></i>
          <span>${tagMeta[key]}</span>
        `;
        detailOptionsGrid.appendChild(pill);
      });

      logData.detailViewCount += 1;
      detailOpenTime = Date.now();

      detailModal.classList.add('open');
      detailModal.style.display = 'flex';
    }

    function closeDetailModal() {
      if (detailOpenTime) {
        const stayDuration = (Date.now() - detailOpenTime) / 1000.0;
        logData.detailStayDurationSec += stayDuration;
        detailOpenTime = null;
      }

      detailModal.classList.remove('open');
      detailModal.style.display = 'none';
      currentPlaceInDetail = null;
    }

    function completeTaskWithSelection() {
      if (!currentPlaceInDetail) return;

      if (detailOpenTime) {
        const stayDuration = (Date.now() - detailOpenTime) / 1000.0;
        logData.detailStayDurationSec += stayDuration;
        detailOpenTime = null;
      }

      logData.taskEndTime = new Date().toISOString();
      const totalDur = (new Date(logData.taskEndTime) - new Date(logData.taskStartTime)) / 1000.0;
      logData.totalDurationSec = parseFloat(totalDur.toFixed(2));
      logData.finalSelectedPlace = currentPlaceInDetail.name;

      if (logData.zeroResultTriggered && !logData.zeroResultRecoveryAction) {
        logData.zeroResultRecoveryAction = "relaxed_filter";
      }

      fetch(GOOGLE_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(logData)
      })
        .then(() => console.log("구글 스프레드시트로 로그 전송 완료"))
        .catch(err => console.error("Webhook Error:", err));

      detailModal.classList.remove('open');
      detailModal.style.display = 'none';

      showCompletionModal(currentPlaceInDetail.name);
    }

    function showCompletionModal(shopName) {
      if (typeof completionShopName !== 'undefined' && completionShopName) {
        completionShopName.textContent = shopName;
      }
      if (typeof completionModal !== 'undefined' && completionModal) {
        completionModal.style.display = 'flex';
      } else {
        alert("선택이 완료되었습니다: " + shopName);
      }
    }
  </script>
</body>

</html>
